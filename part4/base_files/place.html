<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div>
            <!-- Navigation -->
            <a href="index.html"><img  src="images/logo.png" alt="logo" class="logo"></a>
            <!-- Navigation -->
            <nav>
                <a href="index.html" id="index-link">Index</a>
                <a href="login.html" id="login-link">Login</a>
            </nav>
        </div>
    </header>
    <main>
        <section id="place-details" class="place-details">
            <!-- Place details will be populated dynamically -->
        </section>
        <section id="reviews" class="place-reviews">
            <h2>User Reviews</h2>
            <div id="reviews-list">
                <!-- Reviews will be populated dynamically -->

            </div>




















        </section>
        <section id="add-review" class="add-review">
            <h2>Ajouter un avis</h2>
            <form class="form" id="add-review-form">
                <!-- Commentaire -->
                <label for="review-comment">Commentaire :</label>
                <textarea id="review-comment" name="review-comment" rows="4" required></textarea>

                <!-- Nom utilisateur -->
                <label for="review-user">Votre nom :</label>
                <input type="text" id="review-user" name="review-user" required>

                <!-- Note -->
                <label for="review-rating">Note :</label>
                <select id="review-rating" name="review-rating" required>
                    <option value="">--Sélectionnez--</option>
                    <option value="1">1 ⭐</option>
                    <option value="2">2 ⭐⭐</option>
                    <option value="3">3 ⭐⭐⭐</option>
                    <option value="4">4 ⭐⭐⭐⭐</option>
                    <option value="5">5 ⭐⭐⭐⭐⭐</option>
                </select>

                <!-- Bouton submit -->
                <button type="submit">Ajouter l'avis</button>
            </form>
            </section>

    </main>
    <footer class="site-footer">
        <p>All rights reserved</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
